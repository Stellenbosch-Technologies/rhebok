[package]
name = "rhebok-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
publish = false

[[bin]]
name = "rhebok-app"
path = "src/main.rs"

[[test]]
name = "hover_paint"
harness = false

[workspace]

[features]
shoot = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "=0.10.0"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.10.0"
rhebok = { path = "..", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "=1.0.154"
toml = { version = "=1.2.1", features = ["preserve_order"] }
toml_edit = "=0.25.19"
unicode-normalization = "=0.1.26"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSGeometry"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12" }
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.sha2]
opt-level = 3
