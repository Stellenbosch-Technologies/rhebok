name: audit
on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published without any change here, so the lockfiles are
  # also audited weekly against the current advisory databases.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    # Fails on any RustSec vulnerability in Cargo.lock. Unmaintained and
    # unsound notices are printed as warnings and do not fail the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit@0.23.0
      - run: cargo audit

  npm:
    # Only the dashboard's production packages are compiled into the binary;
    # its build tools and the e2e harness never ship.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - working-directory: dashboard
        run: npm audit --omit=dev --package-lock-only
